name: CI

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  BUILD_TAGS: "exclude_graphdriver_btrfs exclude_graphdriver_devicemapper"
  GO_VERSION_FILE: go.mod
  GOVULNCHECK_VERSION: v1.1.4

jobs:
  # ──────────────────────────────────────────────────────────────────
  # 1. Proto API lint (Buf)
  # ──────────────────────────────────────────────────────────────────
  proto-lint:
    name: Proto Lint (Buf)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6

      - name: Buf lint
        uses: bufbuild/buf-action@v1
        with:
          input: protos
          lint: true
          pr_comment: false

  # ──────────────────────────────────────────────────────────────────
  # 2. GitHub Actions syntax and expression validation
  # ──────────────────────────────────────────────────────────────────
  actionlint:
    name: Actionlint
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-go@v6
        with:
          go-version-file: ${{ env.GO_VERSION_FILE }}
          cache: true

      - name: Validate GitHub Actions workflows
        run: go run github.com/rhysd/actionlint/cmd/actionlint@v1.7.7

  # ──────────────────────────────────────────────────────────────────
  # 3. Module metadata drift
  # ──────────────────────────────────────────────────────────────────
  module-drift:
    name: Module Drift
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-go@v6
        with:
          go-version-file: ${{ env.GO_VERSION_FILE }}
          cache: true

      - name: Verify go.mod and go.sum are tidy
        run: |
          go mod tidy
          git diff --exit-code -- go.mod go.sum

  # ──────────────────────────────────────────────────────────────────
  # 2. 린트 (golangci-lint)
  # ──────────────────────────────────────────────────────────────────
  lint:
    name: Lint
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-go@v6
        with:
          go-version-file: ${{ env.GO_VERSION_FILE }}
          cache: true

      - name: Ensure CGo system dependencies
        run: |
          if [ -x /usr/bin/dnf ]; then
            sudo /usr/bin/dnf install -y --enablerepo=powertools \
              gpgme-devel libassuan-devel device-mapper-devel \
              libseccomp-devel pkgconf-pkg-config
          elif [ -x /usr/bin/apt-get ]; then
            sudo /usr/bin/apt-get update -q
            sudo /usr/bin/apt-get install -y --no-install-recommends \
              libgpgme-dev libassuan-dev libbtrfs-dev \
              libdevmapper-dev libseccomp-dev pkg-config
          else
            echo "Unsupported package manager" >&2; exit 1
          fi

      - name: golangci-lint
        uses: golangci/golangci-lint-action@v9
        with:
          version: v2.11.3
          install-mode: goinstall
          args: >-
            --build-tags "${{ env.BUILD_TAGS }}"
            --timeout 10m

  # ──────────────────────────────────────────────────────────────────
  # 2. 빌드 검증
  # ──────────────────────────────────────────────────────────────────
  build:
    name: Build
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-go@v6
        with:
          go-version-file: ${{ env.GO_VERSION_FILE }}
          cache: true

      - name: Ensure CGo system dependencies
        run: |
          if [ -x /usr/bin/dnf ]; then
            sudo /usr/bin/dnf install -y --enablerepo=powertools \
              gpgme-devel libassuan-devel device-mapper-devel \
              libseccomp-devel pkgconf-pkg-config
          elif [ -x /usr/bin/apt-get ]; then
            sudo /usr/bin/apt-get update -q
            sudo /usr/bin/apt-get install -y --no-install-recommends \
              libgpgme-dev libassuan-dev libbtrfs-dev \
              libdevmapper-dev libseccomp-dev pkg-config
          else
            echo "Unsupported package manager" >&2; exit 1
          fi

      - name: go build
        run: go build -tags "${{ env.BUILD_TAGS }}" ./...

      - name: go vet
        run: go vet -tags "${{ env.BUILD_TAGS }}" ./...

  # ──────────────────────────────────────────────────────────────────
  # 3. 유닛 테스트 (-race, -cover)
  # ──────────────────────────────────────────────────────────────────
  test-unit:
    name: Unit Tests
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-go@v6
        with:
          go-version-file: ${{ env.GO_VERSION_FILE }}
          cache: true

      - name: Ensure CGo system dependencies
        run: |
          if [ -x /usr/bin/dnf ]; then
            sudo /usr/bin/dnf install -y --enablerepo=powertools \
              gpgme-devel libassuan-devel device-mapper-devel \
              libseccomp-devel pkgconf-pkg-config
          elif [ -x /usr/bin/apt-get ]; then
            sudo /usr/bin/apt-get update -q
            sudo /usr/bin/apt-get install -y --no-install-recommends \
              libgpgme-dev libassuan-dev libbtrfs-dev \
              libdevmapper-dev libseccomp-dev pkg-config
          else
            echo "Unsupported package manager" >&2; exit 1
          fi

      - name: go test (unit, -race, -cover)
        run: |
          go test \
            -v \
            -race \
            -count=1 \
            -shuffle=on \
            -cover \
            -covermode=atomic \
            -coverprofile=coverage.out \
            -tags "${{ env.BUILD_TAGS }}" \
            ./...

      - name: Create coverage summary
        if: always()
        run: |
          if [ -f coverage.out ]; then
            go tool cover -func=coverage.out | tee coverage.txt
          else
            echo "coverage.out was not produced" | tee coverage.txt
          fi

      - name: Upload coverage report
        uses: actions/upload-artifact@v7
        if: always()
        with:
          name: coverage-${{ github.run_id }}
          path: |
            coverage.out
            coverage.txt
          if-no-files-found: warn
          retention-days: 14

  # ──────────────────────────────────────────────────────────────────
  # 4. 취약점 스캔 (govulncheck)
  # ──────────────────────────────────────────────────────────────────
  vuln-scan:
    name: Vulnerability Scan (govulncheck)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-go@v6
        with:
          go-version-file: ${{ env.GO_VERSION_FILE }}
          cache: true

      - name: Ensure CGo system dependencies
        run: |
          if [ -x /usr/bin/dnf ]; then
            sudo /usr/bin/dnf install -y --enablerepo=powertools \
              gpgme-devel libassuan-devel device-mapper-devel \
              libseccomp-devel pkgconf-pkg-config
          elif [ -x /usr/bin/apt-get ]; then
            sudo /usr/bin/apt-get update -q
            sudo /usr/bin/apt-get install -y --no-install-recommends \
              libgpgme-dev libassuan-dev libbtrfs-dev \
              libdevmapper-dev libseccomp-dev pkg-config
          else
            echo "Unsupported package manager" >&2; exit 1
          fi

      # Reachable findings must be listed (id+module+package, non-expired) in
      # security/govulncheck-exceptions.yaml or this step fails — see
      # cmd/govulncheckgate. Do NOT reintroduce a blanket continue-on-error
      # here: that previously masked 5 real reachable vulnerabilities for
      # every CI run since this step was added.
      - name: govulncheck
        run: |
          set -euo pipefail
          go install "golang.org/x/vuln/cmd/govulncheck@${GOVULNCHECK_VERSION}"
          govulncheck -tags "${{ env.BUILD_TAGS }}" -format json ./... > govulncheck.json
          go run ./cmd/govulncheckgate -input govulncheck.json

      - name: Upload govulncheck report
        uses: actions/upload-artifact@v7
        if: always()
        with:
          name: govulncheck-${{ github.run_id }}
          path: govulncheck.json
          retention-days: 14

  # ──────────────────────────────────────────────────────────────────
  # 5. kube-slint gate (churn suppression + reconcile regression check)
  # ──────────────────────────────────────────────────────────────────
  slint-gate:
    name: kube-slint Gate
    runs-on: ubuntu-latest
    timeout-minutes: 10
    needs: [build]
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-go@v6
        with:
          go-version-file: ${{ env.GO_VERSION_FILE }}
          cache: true

      - name: Ensure CGo system dependencies
        run: |
          if [ -x /usr/bin/dnf ]; then
            sudo /usr/bin/dnf install -y --enablerepo=powertools \
              gpgme-devel libassuan-devel device-mapper-devel \
              libseccomp-devel pkgconf-pkg-config
          elif [ -x /usr/bin/apt-get ]; then
            sudo /usr/bin/apt-get update -q
            sudo /usr/bin/apt-get install -y --no-install-recommends \
              libgpgme-dev libassuan-dev libbtrfs-dev \
              libdevmapper-dev libseccomp-dev pkg-config
          else
            echo "Unsupported package manager" >&2; exit 1
          fi

      - name: Build NodeVault binary
        run: go build -tags "${{ env.BUILD_TAGS }}" -o bin/nodevault ./cmd/controlplane/...

      - name: Run kube-slint gate (churn + regression)
        run: |
          go test \
            -tags "slint ${{ env.BUILD_TAGS }}" \
            -timeout 120s \
            -v \
            -run TestNodeVaultSlintGate \
            ./test/slint/...
        env:
          NODEVAULT_BIN: bin/nodevault

      - name: Upload SLI artifacts
        uses: actions/upload-artifact@v7
        if: always()
        with:
          name: slint-${{ github.run_id }}
          path: |
            artifacts/sli-summary*.json
          retention-days: 14

  # ──────────────────────────────────────────────────────────────────
  # 6. kube-linter (K8s 매니페스트 가드레일)
  # ──────────────────────────────────────────────────────────────────
  kube-lint:
    name: kube-linter
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6

      - name: Install kube-linter
        run: make kube-linter

      - name: kube-linter
        run: make kube-lint
