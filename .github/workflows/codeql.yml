name: CodeQL

on:
  push:
    branches:
      - main
      - master
  pull_request:
    branches:
      - main
      - master
  schedule:
    - cron: "31 3 * * 1"

permissions:
  actions: read
  contents: read
  security-events: write

concurrency:
  group: codeql-${{ github.ref }}
  cancel-in-progress: true

jobs:
  analyze:
    name: Analyze ${{ matrix.language }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      # Deliberately keeps containers_image_openpgp, unlike ci.yml/Makefile/
      # Dockerfile (#29): this job runs on ubuntu-latest with no gpgme-devel/
      # libassuan-devel install step, and the tag avoids that cgo dependency
      # by making go.podman.io/image/v5 use its pure-Go signature mechanism
      # instead. CodeQL only needs NodeVault's own source to compile for
      # analysis; the vendored dependency's internal signature-mechanism
      # choice doesn't affect what gets scanned.
      BUILD_TAGS: "exclude_graphdriver_btrfs containers_image_openpgp exclude_graphdriver_devicemapper"
    strategy:
      fail-fast: false
      matrix:
        include:
          - language: go
            build-mode: manual
          - language: actions
            build-mode: none

    steps:
      - name: Clone the code
        uses: actions/checkout@v7

      - name: Setup Go
        if: matrix.language == 'go'
        uses: actions/setup-go@v7
        with:
          go-version-file: go.mod

      - name: Initialize CodeQL
        uses: github/codeql-action/init@v4
        with:
          languages: ${{ matrix.language }}
          build-mode: ${{ matrix.build-mode }}
          config-file: ./.github/codeql/codeql-config.yml

      - name: Build Go packages
        if: matrix.language == 'go'
        run: |
          go build -tags "${BUILD_TAGS}" ./...

      - name: Perform CodeQL Analysis
        uses: github/codeql-action/analyze@v4
