name: Infra Lab Integration

on:
  workflow_dispatch:
    inputs:
      kubeconfig_path:
        description: Optional canonical /opt/.../infra-lab/state/<env>/kubeconfig path
        required: false
        type: string

permissions:
  contents: read

concurrency:
  group: infra-lab-integration
  cancel-in-progress: false

jobs:
  integration:
    name: Infra Lab Integration
    runs-on: [self-hosted, Linux, X64, infra-lab]
    timeout-minutes: 20
    env:
      BUILD_TAGS: exclude_graphdriver_btrfs exclude_graphdriver_devicemapper
      INFRA_LAB_ROOT: /opt/go/src/github.com/HeaInSeo/infra-lab
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache: true

      - name: Resolve and verify infra-lab
        shell: bash
        run: |
          set -euo pipefail
          command -v kubectl >/dev/null

          kubeconfig_path="${{ inputs.kubeconfig_path }}"
          if [ -n "${kubeconfig_path}" ]; then
            kubeconfig_path="$(realpath "${kubeconfig_path}" 2>/dev/null || true)"
          else
            shopt -s nullglob
            candidates=("${INFRA_LAB_ROOT}"/state/*/kubeconfig)
            if [ "${#candidates[@]}" -ne 1 ]; then
              echo "expected exactly one canonical state kubeconfig; found ${#candidates[@]}" >&2
              echo "provide kubeconfig_path when multiple infra-lab environments exist" >&2
              exit 1
            fi
            kubeconfig_path="$(realpath "${candidates[0]}")"
          fi

          case "${kubeconfig_path}" in
            "${INFRA_LAB_ROOT}"/state/*/kubeconfig) ;;
            *)
              echo "refusing non-canonical or legacy kubeconfig: ${kubeconfig_path}" >&2
              echo "expected ${INFRA_LAB_ROOT}/state/<environment>/kubeconfig" >&2
              exit 1
              ;;
          esac

          if [ ! -f "${kubeconfig_path}" ]; then
            echo "canonical infra-lab kubeconfig was not found" >&2
            exit 1
          fi

          echo "Using canonical kubeconfig: ${kubeconfig_path}"
          echo "INFRALAB_KUBECONFIG=${kubeconfig_path}" >> "${GITHUB_ENV}"
          KUBECONFIG="${kubeconfig_path}" kubectl get nodes
          KUBECONFIG="${kubeconfig_path}" kubectl \
            -n nodevault-system rollout status deployment/nodevault-controlplane \
            --timeout=120s

      - name: Run deployed integration contract
        shell: bash
        run: |
          set -euo pipefail
          make test-integration-infralab 2>&1 | tee infra-lab-integration.log

      - name: Collect failure evidence
        if: failure()
        shell: bash
        run: |
          set +e
          if [ -n "${INFRALAB_KUBECONFIG:-}" ]; then
            KUBECONFIG="${INFRALAB_KUBECONFIG}" kubectl \
              -n nodevault-system get pods -o wide \
              > infra-lab-pods.txt 2>&1
            KUBECONFIG="${INFRALAB_KUBECONFIG}" kubectl \
              -n nodevault-system get events --sort-by=.lastTimestamp \
              > infra-lab-events.txt 2>&1
          fi
          cp /tmp/nodevault-port-forward.log . 2>/dev/null || true

      - name: Upload integration evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: infra-lab-${{ github.run_id }}
          path: |
            infra-lab-integration.log
            infra-lab-pods.txt
            infra-lab-events.txt
            nodevault-port-forward.log
          if-no-files-found: warn
          retention-days: 14
