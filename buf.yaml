version: v2

modules:
  - path: protos

lint:
  use:
    - STANDARD
  # Existing public RPC and imported NodeForge packages predate Buf naming
  # conventions. Renaming them would be a breaking API change; all other
  # STANDARD rules remain enforced for current and new schema changes.
  except:
    - PACKAGE_DIRECTORY_MATCH
    - PACKAGE_SAME_DIRECTORY
    - PACKAGE_SAME_GO_PACKAGE
    - PACKAGE_VERSION_SUFFIX
    - RPC_REQUEST_RESPONSE_UNIQUE
    - RPC_REQUEST_STANDARD_NAME
    - RPC_RESPONSE_STANDARD_NAME
