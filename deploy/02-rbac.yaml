---
# ServiceAccount for the NodeVault control plane Pod.
# NodeVault no longer creates K8s Jobs directly — L3/L4 validation is
# delegated to NodeSentinel via EnqueueValidationWork (gRPC). No
# ClusterRole or ClusterRoleBinding is required.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: nodevault-controlplane
  namespace: nodevault-system
