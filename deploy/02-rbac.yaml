---
# ServiceAccount for NodeVault controlplane (in-cluster 배포용).
# Buildah user namespace builder Job과 L3/L4 smoke Job을 제출한다.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: nodevault-controlplane
  namespace: nodevault-system
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: nodevault-controlplane
rules:
  # Namespace 생성 (nodevault-smoke 자동 생성)
  - apiGroups: [""]
    resources: ["namespaces"]
    verbs: ["get", "list", "create"]
  # Dockerfile/nan build context ConfigMap 관리
  - apiGroups: [""]
    resources: ["configmaps"]
    verbs: ["get", "create", "delete"]
  # L2 builder Job + L3 dry-run + L4 smoke run Job 관리
  - apiGroups: ["batch"]
    resources: ["jobs"]
    verbs: ["get", "list", "create", "delete", "watch"]
  # Builder digest marker와 L4 smoke run 로그 수집
  - apiGroups: [""]
    resources: ["pods", "pods/log"]
    verbs: ["get", "list", "watch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: nodevault-controlplane
subjects:
  - kind: ServiceAccount
    name: nodevault-controlplane
    namespace: nodevault-system
roleRef:
  kind: ClusterRole
  name: nodevault-controlplane
  apiGroup: rbac.authorization.k8s.io
