---
# NodeVault Kubernetes data-plane Deployment
#
# NodeVault itself runs as a long-lived Pod. Image builds are executed inside
# this Pod: NodeVault -> podbridge5 wrapper -> Buildah Go API.
# No builder Job or worker Pod is created.
#
# Required registry credential (not committed to Git):
#   kubectl create secret docker-registry nodevault-registry-auth \
#     --docker-server=harbor.lab.local \
#     --docker-username=<username> \
#     --docker-password=<password> \
#     -n nodevault-system
#
# ORAS referrer credentials (temporary compatibility until ORAS reads the
# mounted auth.json directly):
#   kubectl create secret generic nodevault-harbor-auth \
#     --from-literal=username=<username> \
#     --from-literal=password=<password> \
#     -n nodevault-system
#
# User Namespace support has been validated for the target cluster. The Pod
# therefore runs with hostUsers:false and container-root mapped to an
# unprivileged host UID.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: nodevault-controlplane
  namespace: nodevault-system
  labels:
    app: nodevault-controlplane
spec:
  replicas: 1
  selector:
    matchLabels:
      app: nodevault-controlplane
  template:
    metadata:
      labels:
        app: nodevault-controlplane
    spec:
      hostUsers: false

      # Still required by ValidateService while L3/L4 validation uses
      # Kubernetes Jobs. The image build path itself does not use this token.
      serviceAccountName: nodevault-controlplane
      imagePullSecrets:
        - name: nodevault-registry-auth

      securityContext:
        runAsUser: 0
        seccompProfile:
          type: RuntimeDefault

      containers:
        - name: nodevault
          image: harbor.lab.local/nodevault/controlplane:latest
          imagePullPolicy: Always

          ports:
            - name: grpc
              containerPort: 50051
              protocol: TCP
            - name: webhook
              containerPort: 8082
              protocol: TCP

          env:
            - name: NODEVAULT_REGISTRY_ADDR
              value: "harbor.lab.local"
            - name: NODEVAULT_BUILD_BACKEND
              value: "in-pod-buildah"
            - name: NODEVAULT_RUNTIME_MODE
              value: "incluster"

            # UserNS/Buildah values copied from the already validated spike
            # profile. They now apply to the long-lived NodeVault container.
            - name: _CONTAINERS_USERNS_CONFIGURED
              value: "done"
            - name: _CONTAINERS_ROOTLESS_UID
              value: "1000"
            - name: _CONTAINERS_ROOTLESS_GID
              value: "1000"
            - name: BUILDAH_ISOLATION
              value: "chroot"
            - name: BUILDAH_RUNTIME
              value: "crun"
            - name: HOME
              value: "/tmp/buildhome"
            - name: XDG_CONFIG_HOME
              value: "/tmp/buildhome/.config"
            - name: XDG_DATA_HOME
              value: "/tmp/buildhome/.local/share"

            # ORAS referrer path still consumes explicit credentials. Buildah
            # itself reads /run/containers/0/auth.json mounted below.
            - name: HARBOR_USER
              valueFrom:
                secretKeyRef:
                  name: nodevault-harbor-auth
                  key: username
            - name: HARBOR_PASS
              valueFrom:
                secretKeyRef:
                  name: nodevault-harbor-auth
                  key: password

            # podbridge5 calls containers/storage DefaultStoreOptions(). This
            # environment variable makes the mounted configuration authoritative.
            - name: CONTAINERS_STORAGE_CONF
              value: "/etc/containers/storage.conf"

            - name: CATALOG_DIR
              value: "/data/catalog"
            - name: DATA_CATALOG_DIR
              value: "/data/datacatalog"
            - name: INDEX_DIR
              value: "/data/index"

          securityContext:
            privileged: false
            allowPrivilegeEscalation: false
            runAsUser: 0
            runAsGroup: 0
            capabilities:
              drop:
                - ALL
              add:
                - CHOWN
                - DAC_OVERRIDE
                - FOWNER
                - SETFCAP
                - SYS_CHROOT

          volumeMounts:
            - name: containers-storage-config
              mountPath: /etc/containers/storage.conf
              subPath: storage.conf
              readOnly: true
            - name: build-graphroot
              mountPath: /var/lib/nodevault/containers
            - name: build-runroot
              mountPath: /run/nodevault/containers
            - name: registry-auth
              mountPath: /run/containers/0
              readOnly: true
            - name: nodevault-data
              mountPath: /data
            - name: tmp
              mountPath: /tmp

          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              cpu: 2000m
              memory: 4Gi

          livenessProbe:
            tcpSocket:
              port: 50051
            initialDelaySeconds: 10
            periodSeconds: 30

          readinessProbe:
            tcpSocket:
              port: 50051
            initialDelaySeconds: 5
            periodSeconds: 10

      volumes:
        - name: containers-storage-config
          configMap:
            name: nodevault-containers-storage
        - name: build-graphroot
          emptyDir: {}
        - name: build-runroot
          emptyDir: {}
        - name: registry-auth
          secret:
            secretName: nodevault-registry-auth
            items:
              - key: .dockerconfigjson
                path: auth.json
        - name: nodevault-data
          # PR-1 intentionally keeps storage ephemeral. Durable build state and
          # cache PVCs are the next migration step.
          emptyDir: {}
        - name: tmp
          emptyDir: {}

---
# Explicit containers/storage configuration for the in-Pod builder.
# vfs is retained for the first migration because the existing lab reported
# overlay mount-propagation issues. Overlay/fuse-overlayfs optimization is a
# separate performance change after this execution-model correction.
apiVersion: v1
kind: ConfigMap
metadata:
  name: nodevault-containers-storage
  namespace: nodevault-system
data:
  storage.conf: |
    [storage]
    driver = "vfs"
    runroot = "/run/nodevault/containers"
    graphroot = "/var/lib/nodevault/containers"
    rootless_storage_path = "/var/lib/nodevault/containers"

    [storage.options.pull_options]
    enable_partial_images = "true"

---
# NodeVault gRPC Service (ClusterIP)
apiVersion: v1
kind: Service
metadata:
  name: nodevault-controlplane
  namespace: nodevault-system
  labels:
    app: nodevault-controlplane
spec:
  selector:
    app: nodevault-controlplane
  ports:
    - name: grpc
      port: 50051
      targetPort: 50051
      protocol: TCP
    - name: webhook
      port: 8082
      targetPort: 8082
      protocol: TCP
