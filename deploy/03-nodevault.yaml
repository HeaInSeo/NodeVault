---
# NodeVault Kubernetes data-plane Deployment
#
# NodeVault itself runs as a long-lived Pod. Image builds are executed inside
# this Pod: NodeVault -> podbridge5 wrapper -> Buildah Go API.
# No builder Job or worker Pod is created.
#
# Required registry credential (not committed to Git):
#   kubectl create secret docker-registry nodevault-registry-auth \
#     --docker-server=harbor.lab.local \
#     --docker-username=<username> \
#     --docker-password=<password> \
#     -n nodevault-system
#
# Harbor CA, trusted by in-Pod Buildah pull/push (not shared with the node's
# containerd trust config -- see docs/OVERLAY_USERNS_INVESTIGATION.md §7):
#   kubectl create secret generic nodevault-harbor-ca \
#     --from-file=ca.crt=<path-to-harbor-ca.crt> \
#     -n nodevault-system
#
# User Namespace support has been validated for the target cluster. The Pod
# therefore runs with hostUsers:false and container-root mapped to an
# unprivileged host UID.
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: nodevault-build-graphroot
  namespace: nodevault-system
spec:
  accessModes: ["ReadWriteOnce"]
  resources:
    requests:
      storage: 20Gi
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: nodevault-build-runroot
  namespace: nodevault-system
spec:
  accessModes: ["ReadWriteOnce"]
  resources:
    requests:
      storage: 5Gi
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: nodevault-data
  namespace: nodevault-system
spec:
  accessModes: ["ReadWriteOnce"]
  resources:
    requests:
      storage: 5Gi
---
# Package manager download cache (conda/micromamba).
# Survives Pod restarts so successive builds skip re-downloading packages.
# Size: adjust based on expected package footprint per tool family.
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: nodevault-package-cache
  namespace: nodevault-system
spec:
  accessModes: ["ReadWriteOnce"]
  resources:
    requests:
      storage: 30Gi
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: nodevault-controlplane
  namespace: nodevault-system
  labels:
    app: nodevault-controlplane
  annotations:
    # Image tag is replaced by deploy scripts at runtime (e.g. scripts/deploy-seoy.sh).
    # The :latest placeholder is intentional in the source manifest.
    ignore-check.kube-linter.io/latest-tag: "replaced by deploy scripts at runtime"
    # NodeVault writes to Buildah graphroot, build-state.db, and the
    # TMPDIR scratch dir — readOnlyRootFilesystem cannot be set without
    # mounting every writable path as an emptyDir/PVC, which all write paths
    # already are. The container rootfs itself carries no runtime state.
    ignore-check.kube-linter.io/no-read-only-root-fs: "Buildah graphroot/scratch/buildstate require filesystem writes; all write paths are on PVC or emptyDir mounts"
spec:
  replicas: 1
  selector:
    matchLabels:
      app: nodevault-controlplane
  template:
    metadata:
      labels:
        app: nodevault-controlplane
    spec:
      hostUsers: false

      serviceAccountName: nodevault-controlplane
      imagePullSecrets:
        - name: nodevault-registry-auth

      securityContext:
        runAsUser: 0
        seccompProfile:
          type: RuntimeDefault
        # Required for the in-Pod overlay storage driver AND for podbridge5's
        # chroot-isolation build path (both unshare(CLONE_NEWUSER) calls).
        # See the ConfigMap below for the full investigation.
        appArmorProfile:
          type: Unconfined

      containers:
        - name: nodevault
          image: harbor.lab.local/nodevault/controlplane:latest
          imagePullPolicy: Always

          ports:
            - name: grpc
              containerPort: 50051
              protocol: TCP
            - name: webhook
              containerPort: 8082
              protocol: TCP

          env:
            - name: NODEVAULT_REGISTRY_ADDR
              value: "harbor.lab.local"
            - name: NODEVAULT_BUILD_BACKEND
              value: "in-pod-buildah"
            - name: NODEVAULT_RUNTIME_MODE
              value: "incluster"

            # Kubernetes already places this Pod in a user namespace
            # (hostUsers:false). Do not set Buildah's legacy rootless env here:
            # it forces userxattr on native overlay build-context mounts, which
            # this kernel rejects with EINVAL.
            - name: BUILDAH_ISOLATION
              value: "chroot"
            - name: BUILDAH_RUNTIME
              value: "crun"
            - name: HOME
              value: "/tmp/buildhome"
            - name: XDG_CONFIG_HOME
              value: "/tmp/buildhome/.config"
            - name: XDG_DATA_HOME
              value: "/tmp/buildhome/.local/share"
            # Buildah's build-context overlay scaffolding (upperdir/workdir)
            # defaults to /var/tmp (internal/tmpdir.GetTempDir()), which is
            # NOT a separate mount here -- it lives on the container's root
            # filesystem, itself a containerd-managed overlay. Mounting an
            # overlay whose upperdir sits on another overlay is rejected by
            # the kernel, so TMPDIR must stay on the /tmp emptyDir mount
            # below (same filesystem as pkg/build's buildContextDir lowerdir).
            # A dedicated subdirectory, not all of /tmp, keeps Buildah's
            # scratch space out of HOME (/tmp/buildhome) and out of the
            # build-context overlay's own merged view.
            - name: TMPDIR
              value: "/tmp/nodevault-build/scratch"

            # podbridge5 calls containers/storage DefaultStoreOptions(). This
            # environment variable makes the mounted configuration authoritative.
            - name: CONTAINERS_STORAGE_CONF
              value: "/etc/containers/storage.conf"

            - name: CATALOG_DIR
              value: "/data/catalog"
            - name: DATA_CATALOG_DIR
              value: "/data/datacatalog"
            - name: INDEX_DIR
              value: "/data/index"
            - name: NODEVAULT_BUILD_STATE_DB
              value: "/data/build-state.db"

            # Package manager cache directories (conda/micromamba).
            # Both tools respect CONDA_PKGS_DIRS; micromamba also checks MAMBA_PKG_CACHE.
            - name: CONDA_PKGS_DIRS
              value: "/var/cache/nodevault/packages/conda"
            - name: MAMBA_PKG_CACHE
              value: "/var/cache/nodevault/packages/conda"

            # Harbor layer cache for --cache-from/--cache-to (optional).
            # Set to e.g. "harbor.lab.local/nodevault-cache/layers:latest" to enable.
            # Leave empty (default) to build without a remote layer cache.
            # - name: NODEVAULT_BUILD_CACHE_REF
            #   value: "harbor.lab.local/nodevault-cache/layers:latest"

          securityContext:
            privileged: false
            allowPrivilegeEscalation: false
            runAsUser: 0
            runAsGroup: 0
            capabilities:
              drop:
                - ALL
              add:
                # Full default OCI/Buildah capability set, plus SYS_ADMIN.
                # podbridge5 hardcodes IsolationChroot for every build
                # (image_options.go), which makes Buildah itself
                # unshare(CLONE_NEWUSER)/setgroups()/setcap() for each RUN
                # step. All three calls need this full set. NodeVault's
                # current deployment target is overlay; do not downgrade to
                # vfs/fuse-overlayfs without explicit revalidation. See the
                # ConfigMap below for the full investigation.
                - CHOWN
                - DAC_OVERRIDE
                - FOWNER
                - FSETID
                - KILL
                - SETGID
                - SETUID
                - SETPCAP
                - NET_BIND_SERVICE
                - NET_RAW
                - SYS_CHROOT
                - MKNOD
                - AUDIT_WRITE
                - SETFCAP
                - SYS_ADMIN

          volumeMounts:
            - name: containers-storage-config
              mountPath: /etc/containers/storage.conf
              subPath: storage.conf
              readOnly: true
            - name: build-graphroot
              mountPath: /var/lib/nodevault/containers
            - name: build-runroot
              mountPath: /run/nodevault/containers
            - name: registry-auth
              mountPath: /run/containers/0
              readOnly: true
            - name: nodevault-data
              mountPath: /data
            - name: tmp
              mountPath: /tmp
            # In-Pod Buildah pull/push does not share the node's containerd
            # certs.d trust config (separate filesystem/process). Without
            # this mount, registry.Client.SystemContext() falls through to
            # the default /etc/containers/certs.d/<registry> lookup and
            # finds nothing, failing TLS verification against Harbor's
            # self-signed CA. See docs/OVERLAY_USERNS_INVESTIGATION.md §7.
            - name: harbor-ca
              mountPath: /etc/containers/certs.d/harbor.lab.local
              readOnly: true
            - name: package-cache
              mountPath: /var/cache/nodevault/packages

          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              cpu: 2000m
              memory: 4Gi

          livenessProbe:
            tcpSocket:
              port: 50051
            initialDelaySeconds: 10
            periodSeconds: 30

          readinessProbe:
            tcpSocket:
              port: 50051
            initialDelaySeconds: 5
            periodSeconds: 10

      volumes:
        - name: containers-storage-config
          configMap:
            name: nodevault-containers-storage
        - name: build-graphroot
          persistentVolumeClaim:
            claimName: nodevault-build-graphroot
        - name: build-runroot
          persistentVolumeClaim:
            claimName: nodevault-build-runroot
        - name: registry-auth
          secret:
            secretName: nodevault-registry-auth
            items:
              - key: .dockerconfigjson
                path: auth.json
        - name: nodevault-data
          persistentVolumeClaim:
            claimName: nodevault-data
        - name: tmp
          emptyDir: {}
        - name: harbor-ca
          secret:
            secretName: nodevault-harbor-ca
        - name: package-cache
          persistentVolumeClaim:
            claimName: nodevault-package-cache

---
# Explicit containers/storage configuration for the in-Pod builder.
#
# 2026-06-18: overlay enabled. Full investigation and root cause recorded in
# docs/OVERLAY_USERNS_INVESTIGATION.md — summary:
#
#   The original "overlay is impossible under hostUsers:false" conclusion
#   (driver=vfs) was WRONG and has been superseded. There were two distinct,
#   now-fixed blockers, both caused by containerd's default AppArmor profile
#   (cri-containerd.apparmor.d, enforce) blocking unprivileged-userns kernel
#   restrictions, NOT by overlay/vfs storage semantics or hostUsers:false
#   itself:
#
#   1. The overlay graphroot mount itself needs `mount(MS_PRIVATE)`, which
#      AppArmor's default profile blocked (EPERM/EACCES depending on
#      capability set tested). Fixed by securityContext.appArmorProfile:
#      Unconfined on the Pod (see Deployment above).
#   2. Separately, podbridge5 hardcodes Buildah's IsolationChroot for every
#      build (image_options.go), regardless of storage driver. That path
#      makes Buildah call unshare(CLONE_NEWUSER)/setgroups()/setcap() for
#      every RUN step. Those calls need the full default OCI capability set
#      plus SYS_ADMIN (see the container securityContext above). The previous
#      vfs deployment was not a viable fallback; it had not completed a real
#      RUN-step build.
#
# fuse-overlayfs was also probed and separately confirmed blocked in this
# environment: mounting /dev/fuse into a hostUsers:false Pod via hostPath fails
# at container-create time (mount_setattr idmap incompatibility). Do not switch
# this deployment away from overlay without explicit revalidation.
apiVersion: v1
kind: ConfigMap
metadata:
  name: nodevault-containers-storage
  namespace: nodevault-system
data:
  storage.conf: |
    [storage]
    driver = "overlay"
    runroot = "/run/nodevault/containers"
    graphroot = "/var/lib/nodevault/containers"
    rootless_storage_path = "/var/lib/nodevault/containers"

    [storage.options.pull_options]
    enable_partial_images = "true"

---
# NodeVault gRPC Service (ClusterIP)
apiVersion: v1
kind: Service
metadata:
  name: nodevault-controlplane
  namespace: nodevault-system
  labels:
    app: nodevault-controlplane
spec:
  selector:
    app: nodevault-controlplane
  ports:
    - name: grpc
      port: 50051
      targetPort: 50051
      protocol: TCP
    - name: webhook
      port: 8082
      targetPort: 8082
      protocol: TCP
