---
# Cilium GRPCRoute — NodeVault gRPC 엔드포인트 외부 노출
#
# ⚠ 현재 미사용 — NodeVault가 K8s Pod로 이동할 때 적용한다.
#   현재 NodeKit은 seoy 호스트 IP(100.123.80.48:50051)로 직접 연결한다.
#
# 전제 조건:
#   - Gateway API CRDs v1.3.0 이상 설치됨
#   - Cilium GatewayClass (cilium) + Gateway 가 설치됨
#   - 03-nodevault.yaml (Deployment + Service) 먼저 적용됨
#
# 적용 후 접근 방법 (NodeKit 기준):
#   addr := "nodevault.10.113.24.96.nip.io:80"
#   conn, _ := grpc.NewClient(addr, grpc.WithTransportCredentials(insecure.NewCredentials()))
#
# parentRef 수정 방법:
#   실제 Gateway 이름/네임스페이스를 아래 parentRefs에 반영해야 한다.
#   확인 명령: kubectl get gateway -A
#
# ⚠ hostname: 아래 nip.io 주소는 stale 컨벤션이다 — Harbor는 이미
#   harbor.lab.local(CoreDNS 등록, infra-lab issue #34)로 전환됐다. 이
#   manifest를 실제로 활성화하기 전에 infra-lab과 조율해 실제 CoreDNS에
#   등록된 hostname으로 교체할 것 (추측으로 새 hostname을 넣지 않았다).
apiVersion: gateway.networking.k8s.io/v1
kind: GRPCRoute
metadata:
  name: nodevault-grpc
  namespace: nodevault-system
spec:
  parentRefs:
    # Harbor HTTPRoute와 동일한 Gateway를 공유한다.
    # kubectl get gateway -A → harbor/lab-gateway (cilium, 10.113.24.96)
    - name: lab-gateway
      namespace: harbor
  hostnames:
    - "nodevault.10.113.24.96.nip.io"
  rules:
    # 모든 gRPC 서비스/메서드를 허용 (matches 미지정 = 전체 통과)
    - backendRefs:
        - name: nodevault-controlplane
          port: 50051
