# containers/storage config for the seoy host-level systemd deployment
# (scripts/deploy-seoy.sh, nodevault.service) — NOT used by the K8s
# deployment, which has its own equivalent ConfigMap in deploy/03-nodevault.yaml.
#
# Why this file exists: /etc/containers/storage.conf is a host-wide config
# shared by every rootless container workload on this box (e.g. the
# podbridge5 CI runner). Its runroot ("/run/containers/storage") is root-only
# and containers/storage reads it unconditionally once the process is
# EUID 0 inside podbridge5's user-namespace re-exec — XDG_RUNTIME_DIR is
# ignored at that point, so nodevault.service's own RuntimeDirectory=nodevault
# never gets used. Pointing CONTAINERS_STORAGE_CONF at this file instead
# bypasses that EUID-based path selection entirely, scoping storage to this
# service only without touching the host-wide config.
[storage]
driver = "overlay"
runroot = "/run/nodevault/containers"
graphroot = "/opt/nodevault/containers-storage"

[storage.options.pull_options]
enable_partial_images = "true"
