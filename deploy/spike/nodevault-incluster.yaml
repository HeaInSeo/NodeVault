---
# NodeVault In-Cluster Spike Manifest — Option A (K8sPodbridgeBackend)
#
# Phase 1 (완료): NODEVAULT_BUILD_BACKEND=disabled 로 Core Pod 기동 검증
# Phase 2 (현재): NODEVAULT_BUILD_BACKEND=k8s-job 으로 실제 이미지 빌드 검증
#
# Option A: NodeVault Pod → K8s Job (quay.io/buildah/stable, privileged) → Harbor push
#
# 적용 방법:
#   kubectl apply -f deploy/spike/nodevault-incluster.yaml
#
# 이미지 빌드 및 push 선행 필요 (seoy에서 실행):
#   make vendor && make push-image \
#     IMAGE=harbor.lab.local/nodevault/controlplane:spike-incluster
#   kubectl create secret docker-registry harbor-pull-secret \
#     --docker-server=harbor.lab.local \
#     --docker-username=admin --docker-password=Harbor12345 \
#     -n nodeplatform-system --dry-run=client -o yaml | kubectl apply -f -

apiVersion: v1
kind: Namespace
metadata:
  name: nodeplatform-system
---
# nodevault-builds: builder Job이 실행되는 namespace
apiVersion: v1
kind: Namespace
metadata:
  name: nodevault-builds
---
# nodevault-smoke: L3 dry-run + L4 smoke run Job이 실행되는 namespace
# DryRunJob이 API server-side dry-run을 호출할 때도 namespace 존재가 필요함
apiVersion: v1
kind: Namespace
metadata:
  name: nodevault-smoke
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: nodevault
  namespace: nodeplatform-system
---
# RBAC: ValidateService L3/L4 Job + K8sJobBuilder (Option A) 권한
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: nodevault-spike
rules:
  - apiGroups: ["batch"]
    resources: ["jobs"]
    verbs: ["create", "get", "list", "watch", "delete"]
  - apiGroups: [""]
    resources: ["pods"]
    verbs: ["get", "list", "watch"]
  - apiGroups: [""]
    resources: ["pods/log"]
    verbs: ["get"]
  - apiGroups: [""]
    resources: ["namespaces"]
    verbs: ["get", "create"]
  # K8sJobBuilder: Dockerfile을 ConfigMap으로 전달
  - apiGroups: [""]
    resources: ["configmaps"]
    verbs: ["create", "get", "delete"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: nodevault-spike
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: nodevault-spike
subjects:
  - kind: ServiceAccount
    name: nodevault
    namespace: nodeplatform-system
---
# Harbor push 자격증명 (spike only — production에서는 Vault/ESO 사용)
apiVersion: v1
kind: Secret
metadata:
  name: harbor-push-creds
  namespace: nodeplatform-system
type: Opaque
stringData:
  user: admin
  password: Harbor12345
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: nodevault-spike-config
  namespace: nodeplatform-system
data:
  NODEVAULT_RUNTIME_MODE: "incluster"
  NODEVAULT_BUILD_BACKEND: "k8s-job"
  CATALOG_DIR: "/data/catalog"
  INDEX_DIR: "/data/index"
  NODEVAULT_ADDR: ":50051"
  NODEVAULT_WEBHOOK_ADDR: ":8082"
  NODEVAULT_FAST_RECONCILE: "60s"
  NODEVAULT_SLOW_RECONCILE: "300s"
  # K8sJobBuilder 설정
  NODEVAULT_BUILDER_IMAGE: "quay.io/buildah/stable:v1.37.1"
  NODEVAULT_REGISTRY_ADDR: "harbor.lab.local"
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: nodevault
  namespace: nodeplatform-system
  labels:
    app: nodevault
    variant: incluster-spike
spec:
  replicas: 1
  selector:
    matchLabels:
      app: nodevault
  template:
    metadata:
      labels:
        app: nodevault
        variant: incluster-spike
    spec:
      serviceAccountName: nodevault
      imagePullSecrets:
        - name: harbor-pull-secret

      containers:
        - name: nodevault
          image: harbor.lab.local/nodevault/controlplane:spike-incluster
          imagePullPolicy: Always

          ports:
            - name: grpc
              containerPort: 50051
              protocol: TCP
            - name: webhook
              containerPort: 8082
              protocol: TCP

          envFrom:
            - configMapRef:
                name: nodevault-spike-config

          # Harbor 자격증명 — builder Job에 전달
          env:
            - name: HARBOR_USER
              valueFrom:
                secretKeyRef:
                  name: harbor-push-creds
                  key: user
            - name: HARBOR_PASS
              valueFrom:
                secretKeyRef:
                  name: harbor-push-creds
                  key: password

          volumeMounts:
            - name: data
              mountPath: /data

          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 512Mi

          livenessProbe:
            tcpSocket:
              port: 50051
            initialDelaySeconds: 10
            periodSeconds: 30

          readinessProbe:
            tcpSocket:
              port: 50051
            initialDelaySeconds: 5
            periodSeconds: 10

      volumes:
        - name: data
          emptyDir: {}
---
apiVersion: v1
kind: Service
metadata:
  name: nodevault-grpc
  namespace: nodeplatform-system
  labels:
    app: nodevault
spec:
  selector:
    app: nodevault
  ports:
    - name: grpc
      port: 50051
      targetPort: 50051
      protocol: TCP
---
apiVersion: v1
kind: Service
metadata:
  name: nodevault-webhook
  namespace: nodeplatform-system
  labels:
    app: nodevault
spec:
  selector:
    app: nodevault
  ports:
    - name: webhook
      port: 8082
      targetPort: 8082
      protocol: TCP
