---
# NodeVault In-Cluster Spike Manifest
#
# 목적: NodeVault Core가 K8s Pod 내부에서 기동 가능한지 검증한다.
#       이미지 빌드(podbridge5)는 disabled 상태로 비활성화한다.
#
# 확인 대상:
#   - Pod Running 상태
#   - logs에 runtime_mode=incluster 표시
#   - PingService gRPC 응답
#   - BuildRequest → "build backend disabled" 에러 (서버는 유지)
#
# 적용 방법:
#   kubectl apply -f deploy/spike/nodevault-incluster.yaml
#
# 이미지 빌드 및 push 선행 필요:
#   make vendor && make push-image \
#     IMAGE=harbor.10.113.24.96.nip.io/nodevault/controlplane:spike-incluster
#   kubectl create secret docker-registry harbor-pull-secret \
#     --docker-server=harbor.10.113.24.96.nip.io \
#     --docker-username=admin --docker-password=Harbor12345 \
#     -n nodeplatform-system

apiVersion: v1
kind: Namespace
metadata:
  name: nodeplatform-system
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: nodevault
  namespace: nodeplatform-system
---
# RBAC: L3/L4 Job 실행 권한 (spike에서도 ValidateService가 기동됨)
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: nodevault-spike
rules:
  - apiGroups: ["batch"]
    resources: ["jobs"]
    verbs: ["create", "get", "list", "watch", "delete"]
  - apiGroups: [""]
    resources: ["pods"]
    verbs: ["get", "list", "watch"]
  - apiGroups: [""]
    resources: ["pods/log"]
    verbs: ["get"]
  - apiGroups: [""]
    resources: ["namespaces"]
    verbs: ["get", "create"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: nodevault-spike
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: nodevault-spike
subjects:
  - kind: ServiceAccount
    name: nodevault
    namespace: nodeplatform-system
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: nodevault-spike-config
  namespace: nodeplatform-system
data:
  NODEVAULT_RUNTIME_MODE: "incluster"
  NODEVAULT_BUILD_BACKEND: "disabled"
  CATALOG_DIR: "/data/catalog"
  INDEX_DIR: "/data/index"
  NODEVAULT_ADDR: ":50051"
  NODEVAULT_WEBHOOK_ADDR: ":8082"
  # Fast/slow reconcile 단축 (spike 중 빠른 확인)
  NODEVAULT_FAST_RECONCILE: "60s"
  NODEVAULT_SLOW_RECONCILE: "300s"
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: nodevault
  namespace: nodeplatform-system
  labels:
    app: nodevault
    variant: incluster-spike
spec:
  replicas: 1
  selector:
    matchLabels:
      app: nodevault
  template:
    metadata:
      labels:
        app: nodevault
        variant: incluster-spike
    spec:
      serviceAccountName: nodevault
      imagePullSecrets:
        - name: harbor-pull-secret

      containers:
        - name: nodevault
          image: harbor.10.113.24.96.nip.io/nodevault/controlplane:spike-incluster
          imagePullPolicy: Always

          ports:
            - name: grpc
              containerPort: 50051
              protocol: TCP
            - name: webhook
              containerPort: 8082
              protocol: TCP

          envFrom:
            - configMapRef:
                name: nodevault-spike-config

          # catalog + index는 spike 동안 emptyDir (Pod 재시작 시 초기화)
          volumeMounts:
            - name: data
              mountPath: /data

          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 512Mi

          livenessProbe:
            tcpSocket:
              port: 50051
            initialDelaySeconds: 10
            periodSeconds: 30

          readinessProbe:
            tcpSocket:
              port: 50051
            initialDelaySeconds: 5
            periodSeconds: 10

      volumes:
        - name: data
          emptyDir: {}
---
apiVersion: v1
kind: Service
metadata:
  name: nodevault-grpc
  namespace: nodeplatform-system
  labels:
    app: nodevault
spec:
  selector:
    app: nodevault
  ports:
    - name: grpc
      port: 50051
      targetPort: 50051
      protocol: TCP
---
# NodePalette catalog REST (선택적 — spike 검증 범위 밖이지만 포트 노출만)
apiVersion: v1
kind: Service
metadata:
  name: nodevault-webhook
  namespace: nodeplatform-system
  labels:
    app: nodevault
spec:
  selector:
    app: nodevault
  ports:
    - name: webhook
      port: 8082
      targetPort: 8082
      protocol: TCP
