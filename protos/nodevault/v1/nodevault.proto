syntax = "proto3";

package nodevault.v1;

option go_package = "github.com/HeaInSeo/NodeVault/protos/nodevault/v1;nodevaultv1";

// ─────────────────────────────────────────────────────────────────────────────
// 공통 스펙 메시지 (RegisteredTool v0.2)
// ─────────────────────────────────────────────────────────────────────────────

message PortSpec {
  string name = 1;
  string role = 2;
  string format = 3;
  string shape = 4;
  bool required = 5;
  string class = 6;
  map<string, string> constraints = 7;
}

message DisplaySpec {
  string label = 1;
  string description = 2;
  string category = 3;
  repeated string tags = 4;
}

message ValidationStatus {
  string phase = 1;
  int64 last_validated_at = 2;
  repeated string failures = 3;
}

// ─────────────────────────────────────────────────────────────────────────────
// PolicyService — DockGuard 정책 번들 관리
// ─────────────────────────────────────────────────────────────────────────────

service PolicyService {
  rpc GetPolicyBundle(GetPolicyBundleRequest) returns (PolicyBundle);
  rpc ListPolicies(ListPoliciesRequest) returns (ListPoliciesResponse);
}

message GetPolicyBundleRequest {}

message PolicyBundle {
  bytes wasm_bytes = 1;
  string version = 2;
  int64 built_at = 3;
}

message ListPoliciesRequest {}

message PolicyInfo {
  string rule_id = 1;
  string name = 2;
  string version = 3;
  string description = 4;
}

message ListPoliciesResponse {
  repeated PolicyInfo policies = 1;
  string bundle_version = 2;
}

// BuildKind identifies which image type a build produces.
// TOOLSPEC builds a base image from a build recipe (dockerfile_content + environment_spec).
// TOOLFUNCTIONSPEC builds a function image on top of a base image (base_image_digest + script + nan shim).
enum BuildKind {
  BUILD_KIND_UNSPECIFIED = 0;
  BUILD_KIND_TOOLSPEC = 1;
  BUILD_KIND_TOOLFUNCTIONSPEC = 2;
}

// ─────────────────────────────────────────────────────────────────────────────
// BuildService — in-Pod podbridge5/Buildah orchestration
// ─────────────────────────────────────────────────────────────────────────────

service BuildService {
  // Deprecated: use ResolveToolSpec + SubmitToolBuild + WatchToolBuild.
  // BuildAndRegister stays available only while NodeKit UI/library callers
  // still submit legacy BuildRequest messages. option deprecated = true below
  // surfaces this as a real compiler-level deprecation marker in generated
  // clients (e.g. C#'s [Obsolete]), not just a comment, so callers get a
  // build warning rather than having to notice a doc string.
  rpc BuildAndRegister(BuildRequest) returns (stream BuildEvent) {
    option deprecated = true;
  };
  // ResolveToolSpec normalizes the submitted raw_spec and computes its
  // content digest (tool_spec_digest). It never selects or rewrites the
  // author's package/build/base-image choice — that choice must already be
  // reflected in raw_spec before this call (issue #18, docs/NONGOALS.md N-11).
  rpc ResolveToolSpec(ToolSpecRequest) returns (ResolvedToolSpecResponse);
  rpc SubmitToolBuild(SubmitToolBuildRequest) returns (SubmitToolBuildResponse);
  rpc WatchToolBuild(WatchToolBuildRequest) returns (stream BuildEvent);
  rpc CancelToolBuild(CancelToolBuildRequest) returns (CancelToolBuildResponse);
  // ResolveRecipe is a candidate lookup API: it returns reproducible
  // package/image candidates for the author (via NodeKit) to choose from. It
  // does not select a canonical candidate or rewrite raw_spec/Dockerfile
  // content itself (issue #18, docs/NONGOALS.md N-11).
  rpc ResolveRecipe(ResolveRecipeRequest) returns (ResolveRecipeResponse);
}

message ToolSpecRequest {
  string tool_name = 1;
  string version = 2;
  string raw_spec = 3;
  int64 requested_at = 4;
}

message ResolvedToolSpecResponse {
  string tool_spec_digest = 1;
  string tool_name = 2;
  string version = 3;
  int64 resolved_at = 4;
}

message SubmitToolBuildRequest {
  string request_id = 1;
  string tool_spec_digest = 2;
}

message SubmitToolBuildResponse {
  string build_id = 1;
  string tool_spec_digest = 2;
  string status = 3;
  int64 submitted_at = 4;
}

message WatchToolBuildRequest {
  string build_id = 1;
}

message CancelToolBuildRequest {
  string build_id = 1;
  string reason = 2;
}

message CancelToolBuildResponse {
  string build_id = 1;
  string status = 2;
  int64 cancelled_at = 3;
}

// ── ResolveRecipe — 빌드 전 artifact 후보 조회 ──────────────────────────────
// ResolveRecipe returns candidate artifact pins. It does not rewrite raw_spec
// or create a canonical build request; callers must reflect a selected candidate
// into dockerfile_content/environment_spec before SubmitToolBuild. NodeVault's
// build gate validates that submitted conda/mamba package specs are fully pinned
// as name=version=build.

enum RecipeVariant {
  RECIPE_VARIANT_UNSPECIFIED = 0;
  RECIPE_VARIANT_CONDA = 1;
  RECIPE_VARIANT_MICROMAMBA = 2;
  RECIPE_VARIANT_PACKAGE_MIRROR = 3;
  RECIPE_VARIANT_BIOCONTAINER = 4;
}

message PackageSpec {
  string name = 1;
  string version = 2;
}

// BuildStringCandidate is a single resolved artifact option for a package.
message BuildStringCandidate {
  string build_string = 1;
  string full_pin = 2;
  string channel = 3;
}

// PackageResolution groups candidates for a single package.
message PackageResolution {
  string name = 1;
  string version = 2;
  repeated BuildStringCandidate candidates = 3;
}

message ResolveRecipeRequest {
  string tool_name = 1;
  string version = 2;
  RecipeVariant variant = 3;
  repeated PackageSpec packages = 4;
  repeated string channels = 5;
  string package_mirror_uri = 6;
  string bio_container_image_uri = 7;
  bool closed_network = 8;
}

// ResolveRecipeResponse returns artifact candidates for each requested package.
// resolution_source: "harbor_cache" | "external_source" | "not_found"
message ResolveRecipeResponse {
  string resolution_source = 1;
  repeated PackageResolution packages = 2;
}

// BuildRequest is consumed by NodeVault's build path after server-side policy validation.
// Current implementation supports BUILD_KIND_UNSPECIFIED as legacy TOOLSPEC and
// BUILD_KIND_TOOLSPEC. BUILD_KIND_TOOLFUNCTIONSPEC is modeled in the API but is
// rejected by the Dockerfile build path until the function-image builder exists.
message BuildRequest {
  string request_id = 1;
  string tool_definition_id = 2;
  string tool_name = 3;
  string image_uri = 4;
  string version = 10;
  BuildKind kind = 16;

  // BUILD_KIND_TOOLSPEC: base image from build recipe. NodeVault does not rewrite
  // this Dockerfile; it validates policy and passes the content to the builder.
  string dockerfile_content = 5;
  string environment_spec = 9;

  // BUILD_KIND_TOOLFUNCTIONSPEC: function image on top of base image. Reserved
  // for the future function-image builder, not accepted by today's Dockerfile path.
  string script = 6;
  string base_image_digest = 17;

  // allow_runtime_tools exempts specific fetch/build tools (see
  // pkg/build.riskyRuntimeTools) from the final-image-stage runtime tool
  // policy (Sprint 9). allow_runtime_tools_reason must be non-empty for the
  // exemption to take effect — an empty reason means the exemption is
  // ignored and the default reject policy applies.
  repeated string allow_runtime_tools = 18;
  string allow_runtime_tools_reason = 19;

  reserved 7, 8, 12, 13, 14, 15;
  reserved "input_names", "output_names", "inputs", "outputs", "display", "command";
}

enum BuildEventKind {
  BUILD_EVENT_KIND_UNSPECIFIED = 0;
  BUILD_EVENT_KIND_LOG = 1;
  BUILD_EVENT_KIND_JOB_CREATED = 2;
  BUILD_EVENT_KIND_JOB_RUNNING = 3;
  BUILD_EVENT_KIND_PUSH_SUCCEEDED = 4;
  BUILD_EVENT_KIND_DIGEST_ACQUIRED = 5;
  BUILD_EVENT_KIND_SUCCEEDED = 6;
  BUILD_EVENT_KIND_FAILED = 7;
}

message BuildEvent {
  BuildEventKind kind = 1;
  string message = 2;
  int64 timestamp = 3;
  string digest = 4;
  string build_id = 5;
  string status = 6;
  // image_ref, image_digest, spec_referrer_digest, integrity_health mirror
  // pkg/buildstate.Record's artifact fields (Sprint 7 bridge) so NodeKit can
  // read them from WatchToolBuild without scraping logs or reading index
  // state directly. integrity_health here is a read-through snapshot of the
  // reconcile axis at Record.SetReferrer time, not written by pkg/build.
  string image_ref = 7;
  string image_digest = 8;
  string spec_referrer_digest = 9;
  string integrity_health = 10;
}

// ─────────────────────────────────────────────────────────────────────────────
// ValidateService — L3 dry-run + L4 smoke run
// ─────────────────────────────────────────────────────────────────────────────

service ValidateService {
  rpc DryRun(DryRunRequest) returns (DryRunResult);
  rpc SmokeRun(SmokeRunRequest) returns (SmokeRunResult);
}

message DryRunRequest {
  string request_id = 1;
  string manifest_yaml = 2;
}

message DryRunResult {
  bool success = 1;
  string error_message = 2;
}

message SmokeRunRequest {
  string request_id = 1;
  string manifest_yaml = 2;
}

message SmokeRunResult {
  bool success = 1;
  int32 exit_code = 2;
  string log_output = 3;
  string error_message = 4;
}

// ─────────────────────────────────────────────────────────────────────────────
// ToolRegistryService — RegisteredToolDefinition 관리
// ─────────────────────────────────────────────────────────────────────────────

service ToolRegistryService {
  rpc RegisterTool(RegisterToolRequest) returns (RegisterToolResponse);
  rpc GetTool(GetToolRequest) returns (RegisteredToolDefinition);
  rpc ListTools(ListToolsRequest) returns (ListToolsResponse);
  rpc RetractTool(RetractToolRequest) returns (RetractToolResponse);
  rpc DeleteTool(DeleteToolRequest) returns (DeleteToolResponse);
}

message RegisterToolRequest {
  string request_id = 1;
  string tool_definition_id = 2;
  string tool_name = 3;
  string image_uri = 4;
  string digest = 5;
  string environment_spec = 8;
  string version = 9;
  string stable_ref = 10;
  BuildKind build_kind = 15;

  // Build-time registration stores ToolSpec image/environment metadata only.
  // ToolFunctionSpec metadata is not accepted on this request; command,
  // inputs, outputs, and display are populated by the function/validation path.
  reserved 6, 7, 11, 12, 13, 14;
  reserved "input_names", "output_names", "inputs", "outputs", "display", "command";
}

message RegisterToolResponse {
  string cas_hash = 1;
  RegisteredToolDefinition tool = 2;
}

message GetToolRequest {
  string cas_hash = 1;
}

message ListToolsRequest {
  string stable_ref = 1;
  string artifact_kind = 2;
}

message ListToolsResponse {
  repeated RegisteredToolDefinition tools = 1;
}

message RegisteredToolDefinition {
  string cas_hash = 1;
  string tool_definition_id = 2;
  string tool_name = 3;
  string image_uri = 4;
  string digest = 5;
  int64 registered_at = 8;
  string environment_spec = 9;
  string version = 10;
  string stable_ref = 11;
  string lifecycle_phase = 15;
  ValidationStatus validation = 16;
  string integrity_health = 18;
  BuildKind build_kind = 19;

  // ToolFunctionSpec fields — populated by the function/validation path, not at L2 build time.
  // inputs (12), outputs (13), display (14), command (17) are reserved for ToolFunctionSpec.
  repeated PortSpec inputs = 12;
  repeated PortSpec outputs = 13;
  DisplaySpec display = 14;
  string command = 17;

  reserved 6, 7;
  reserved "input_names", "output_names";
}

message RetractToolRequest {
  string cas_hash = 1;
  string reason = 2;
}

message RetractToolResponse {
  string cas_hash = 1;
  string lifecycle_phase = 2;
}

message DeleteToolRequest {
  string cas_hash = 1;
  string reason = 2;
}

message DeleteToolResponse {
  string cas_hash = 1;
  string lifecycle_phase = 2;
}

// ─────────────────────────────────────────────────────────────────────────────
// DataRegistryService — 참조 데이터(reference data) artifact 관리
// ─────────────────────────────────────────────────────────────────────────────

service DataRegistryService {
  rpc RegisterData(DataRegisterRequest) returns (DataRegisterResponse);
  rpc GetData(GetDataRequest) returns (RegisteredDataDefinition);
  rpc ListData(ListDataRequest) returns (ListDataResponse);
}

message DataRegisterRequest {
  string request_id = 1;
  string data_name = 2;
  string version = 3;
  string description = 4;
  string format = 5;
  string source_uri = 6;
  string checksum = 7;
  string storage_uri = 8;
  string stable_ref = 9;
  DisplaySpec display = 10;
}

message DataRegisterResponse {
  string cas_hash = 1;
  RegisteredDataDefinition data = 2;
}

message GetDataRequest {
  string cas_hash = 1;
}

message ListDataRequest {
  string stable_ref = 1;
}

message ListDataResponse {
  repeated RegisteredDataDefinition data = 1;
}

message RegisteredDataDefinition {
  string cas_hash = 1;
  string data_name = 2;
  string version = 3;
  string description = 4;
  string format = 5;
  string source_uri = 6;
  string checksum = 7;
  string storage_uri = 8;
  string stable_ref = 9;
  DisplaySpec display = 10;
  int64 registered_at = 11;
  string lifecycle_phase = 12;
  string integrity_health = 13;
}

// ─────────────────────────────────────────────────────────────────────────────
// ValidationResultService — NodeSentinel → NodeVault validation record push
// ─────────────────────────────────────────────────────────────────────────────

service ValidationResultService {
  // SubmitToolCheckRecord receives a L5-a functional validation result from NodeSentinel.
  rpc SubmitToolCheckRecord(ToolCheckRecordRequest) returns (SubmitRecordResponse);
  // SubmitToolScanRecord receives a L5-b trivy security scan result from NodeSentinel.
  rpc SubmitToolScanRecord(ToolScanRecordRequest) returns (SubmitRecordResponse);
  // ListCertifiedTools returns all active certified tool catalog entries.
  rpc ListCertifiedTools(ListCertifiedToolsRequest) returns (ListCertifiedToolsResponse);
}

message PortObservation {
  string port       = 1;
  int32  file_count = 2;
  bool   non_empty  = 3;
}

message ObservedIoProfile {
  repeated PortObservation inputs  = 1;
  repeated PortObservation outputs = 2;
}

message ObservedResourceProfile {
  int64 peak_cpu_millicores = 1;
  int64 peak_memory_mib     = 2;
  int64 duration_seconds    = 3;
  int64 disk_read_mib       = 4;
  int64 disk_write_mib      = 5;
  bool  timeout             = 6;
  int64 timeout_seconds     = 7;
}

message ContractCheck {
  bool   all_outputs_present = 1;
  string result              = 2; // "pass" | "fail" | "unknown"
}

message ToolCheckRecordRequest {
  string check_id         = 1;
  string tool_spec_digest = 2;
  string image_digest     = 3;
  string tool_name        = 4;
  string version          = 5;
  // validation_status: "succeeded" | "infra_failed" | "app_failed"
  string validation_status  = 6;
  string validation_hash    = 7;
  string command            = 8;
  int32  exit_code          = 9;
  ObservedIoProfile        observed_io_profile       = 10;
  ObservedResourceProfile  observed_resource_profile = 11;
  ContractCheck            contract_check            = 12;
  string failure_reason     = 13;
  int64  checked_at         = 14;
  string platform           = 15;
}

message ToolScanRecordRequest {
  string scan_id          = 1;
  string image_digest     = 2;
  string tool_name        = 3;
  string scanner          = 4;
  string scanner_version  = 5;
  string source           = 6;
  int32  critical_count   = 7;
  int32  high_count       = 8;
  int32  medium_count     = 9;
  int32  low_count        = 10;
  string policy_mode      = 11;
  string policy_result    = 12;
  int64  scanned_at       = 13;
  string db_digest        = 14;
  string platform         = 15;
}

message SubmitRecordResponse {
  string record_id         = 1;
  string certification_status = 2; // "certified" | "pending" | "failed"
}

message ListCertifiedToolsRequest {
  string promotion_status = 1; // "" = all active
}

message CertifiedToolEntry {
  string cas_hash          = 1;
  string tool_name         = 2;
  string version           = 3;
  string stable_ref        = 4;
  string image_digest      = 5;
  string image_ref         = 6;
  string display_label     = 7;
  string display_category  = 8;
  string promotion_status  = 9;
  int64  certified_at      = 10;
  string validation_hash   = 11;
}

message ListCertifiedToolsResponse {
  repeated CertifiedToolEntry tools = 1;
}

// ─────────────────────────────────────────────────────────────────────────────
// PingService — Phase 0 연결 확인용 (ping/pong)
// ─────────────────────────────────────────────────────────────────────────────

service PingService {
  rpc Ping(PingRequest) returns (PingResponse);
}

message PingRequest {
  string message = 1;
}

message PingResponse {
  string message = 1;
  string server_id = 2;
}
