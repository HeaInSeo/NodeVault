syntax = "proto3";

package nodevault.v1;

option go_package = "github.com/HeaInSeo/NodeVault/protos/nodevault/v1;nodevaultv1";

// ─────────────────────────────────────────────────────────────────────────────
// 공통 스펙 메시지 (RegisteredTool v0.2)
// ─────────────────────────────────────────────────────────────────────────────

message PortSpec {
  string name = 1;
  string role = 2;
  string format = 3;
  string shape = 4;
  bool required = 5;
  string class = 6;
  map<string, string> constraints = 7;
}

message DisplaySpec {
  string label = 1;
  string description = 2;
  string category = 3;
  repeated string tags = 4;
}

message ValidationStatus {
  string phase = 1;
  int64 last_validated_at = 2;
  repeated string failures = 3;
}

// ─────────────────────────────────────────────────────────────────────────────
// PolicyService — DockGuard 정책 번들 관리
// ─────────────────────────────────────────────────────────────────────────────

service PolicyService {
  rpc GetPolicyBundle(GetPolicyBundleRequest) returns (PolicyBundle);
  rpc ListPolicies(ListPoliciesRequest) returns (ListPoliciesResponse);
}

message GetPolicyBundleRequest {}

message PolicyBundle {
  bytes wasm_bytes = 1;
  string version = 2;
  int64 built_at = 3;
}

message ListPoliciesRequest {}

message PolicyInfo {
  string rule_id = 1;
  string name = 2;
  string version = 3;
  string description = 4;
}

message ListPoliciesResponse {
  repeated PolicyInfo policies = 1;
  string bundle_version = 2;
}

// BuildKind identifies which image type a build produces.
// TOOLSPEC builds a base image from a build recipe (dockerfile_content + environment_spec).
// TOOLFUNCTIONSPEC builds a function image on top of a base image (base_image_digest + script + nan shim).
enum BuildKind {
  BUILD_KIND_UNSPECIFIED = 0;
  BUILD_KIND_TOOLSPEC = 1;
  BUILD_KIND_TOOLFUNCTIONSPEC = 2;
}

// ─────────────────────────────────────────────────────────────────────────────
// BuildService — in-Pod podbridge5/Buildah orchestration
// ─────────────────────────────────────────────────────────────────────────────

service BuildService {
  // ResolveToolSpec normalizes the submitted raw_spec and computes its
  // content digest (tool_spec_digest). It never selects or rewrites the
  // author's package/build/base-image choice — that choice must already be
  // reflected in raw_spec before this call (issue #18, docs/NONGOALS.md N-11).
  rpc ResolveToolSpec(ToolSpecRequest) returns (ResolvedToolSpecResponse);
  rpc SubmitToolBuild(SubmitToolBuildRequest) returns (SubmitToolBuildResponse);
  rpc WatchToolBuild(WatchToolBuildRequest) returns (stream BuildEvent);
  rpc CancelToolBuild(CancelToolBuildRequest) returns (CancelToolBuildResponse);
  // ResolveRecipe is a candidate lookup API: it returns reproducible
  // package/image candidates for the author (via NodeKit) to choose from. It
  // does not select a canonical candidate or rewrite raw_spec/Dockerfile
  // content itself (issue #18, docs/NONGOALS.md N-11).
  rpc ResolveRecipe(ResolveRecipeRequest) returns (ResolveRecipeResponse);
}

message ToolSpecRequest {
  string tool_name = 1;
  string version = 2;
  string raw_spec = 3;
  int64 requested_at = 4;
}

message ResolvedToolSpecResponse {
  string tool_spec_digest = 1;
  string tool_name = 2;
  string version = 3;
  int64 resolved_at = 4;
}

message SubmitToolBuildRequest {
  string request_id = 1;
  string tool_spec_digest = 2;
}

message SubmitToolBuildResponse {
  string build_id = 1;
  string tool_spec_digest = 2;
  string status = 3;
  int64 submitted_at = 4;
}

message WatchToolBuildRequest {
  string build_id = 1;
}

message CancelToolBuildRequest {
  string build_id = 1;
  string reason = 2;
}

message CancelToolBuildResponse {
  string build_id = 1;
  string status = 2;
  int64 cancelled_at = 3;
}

// ── ResolveRecipe — 빌드 전 artifact 후보 조회 ──────────────────────────────
// ResolveRecipe returns candidate artifact pins. It does not rewrite raw_spec
// or create a canonical build request; callers must reflect a selected candidate
// into dockerfile_content/environment_spec before SubmitToolBuild. NodeVault's
// build gate validates that submitted conda/mamba package specs are fully pinned
// as name=version=build.

enum RecipeKind {
  RECIPE_KIND_UNSPECIFIED = 0;
  RECIPE_KIND_CONDA = 1;
  RECIPE_KIND_MICROMAMBA = 2;
  RECIPE_KIND_PACKAGE_MIRROR = 3;
  RECIPE_KIND_BIOCONTAINER = 4;
}

message PackageSpec {
  string name = 1;
  string version = 2;
}

// BuildStringCandidate is a single resolved artifact option for a package.
message BuildStringCandidate {
  string build_string = 1;
  string full_pin = 2;
  string channel = 3;
}

// PackageResolution groups candidates for a single package.
message PackageResolution {
  string name = 1;
  string version = 2;
  repeated BuildStringCandidate candidates = 3;
}

message ResolveRecipeRequest {
  string tool_name = 1;
  string version = 2;
  RecipeKind recipe_kind = 3;
  repeated PackageSpec packages = 4;
  repeated string channels = 5;
  string package_mirror_uri = 6;
  string bio_container_image_uri = 7;
  bool closed_network = 8;
}

// ResolveRecipeResponse returns artifact candidates for each requested package.
// resolution_source: "harbor_cache" | "external_source" | "not_found"
message ResolveRecipeResponse {
  string resolution_source = 1;
  repeated PackageResolution packages = 2;
}

// BuildRequest is consumed by NodeVault's build path after server-side policy validation.
// Current implementation supports BUILD_KIND_UNSPECIFIED as legacy TOOLSPEC and
// BUILD_KIND_TOOLSPEC. BUILD_KIND_TOOLFUNCTIONSPEC is modeled in the API but is
// rejected by the Dockerfile build path until the function-image builder exists.
message BuildRequest {
  string request_id = 1;
  string tool_definition_id = 2;
  string tool_name = 3;
  string image_uri = 4;
  string version = 10;
  BuildKind kind = 16;

  // BUILD_KIND_TOOLSPEC: base image from build recipe. NodeVault does not rewrite
  // this Dockerfile; it validates policy and passes the content to the builder.
  string dockerfile_content = 5;
  string environment_spec = 9;

  // BUILD_KIND_TOOLFUNCTIONSPEC: function image on top of base image. Reserved
  // for the future function-image builder, not accepted by today's Dockerfile path.
  string script = 6;
  string base_image_digest = 17;

  // allow_runtime_tools exempts specific fetch/build tools (see
  // pkg/build.riskyRuntimeTools) from the final-image-stage runtime tool
  // policy (Sprint 9). allow_runtime_tools_reason must be non-empty for the
  // exemption to take effect — an empty reason means the exemption is
  // ignored and the default reject policy applies.
  repeated string allow_runtime_tools = 18;
  string allow_runtime_tools_reason = 19;

  reserved 7, 8, 11, 12, 13, 14, 15;
  reserved "input_names", "output_names", "inputs", "outputs", "display", "command";
}

enum BuildEventKind {
  BUILD_EVENT_KIND_UNSPECIFIED = 0;
  BUILD_EVENT_KIND_LOG = 1;
  BUILD_EVENT_KIND_JOB_CREATED = 2;
  BUILD_EVENT_KIND_JOB_RUNNING = 3;
  BUILD_EVENT_KIND_PUSH_SUCCEEDED = 4;
  BUILD_EVENT_KIND_DIGEST_ACQUIRED = 5;
  BUILD_EVENT_KIND_SUCCEEDED = 6;
  BUILD_EVENT_KIND_FAILED = 7;
}

message BuildEvent {
  BuildEventKind kind = 1;
  string message = 2;
  int64 timestamp = 3;
  string digest = 4;
  string build_id = 5;
  string status = 6;
  // image_ref, image_digest, spec_referrer_digest, integrity_health mirror
  // pkg/buildstate.Record's artifact fields (Sprint 7 bridge) so NodeKit can
  // read them from WatchToolBuild without scraping logs or reading index
  // state directly. integrity_health here is a read-through snapshot of the
  // reconcile axis at Record.SetReferrer time, not written by pkg/build.
  string image_ref = 7;
  string image_digest = 8;
  string spec_referrer_digest = 9;
  string integrity_health = 10;
}

// ─────────────────────────────────────────────────────────────────────────────
// ValidateService — L3 dry-run + L4 smoke run
// ─────────────────────────────────────────────────────────────────────────────

service ValidateService {
  rpc DryRun(DryRunRequest) returns (DryRunResult);
  rpc SmokeRun(SmokeRunRequest) returns (SmokeRunResult);
}

message DryRunRequest {
  string request_id = 1;
  string manifest_yaml = 2;
}

message DryRunResult {
  bool success = 1;
  string error_message = 2;
}

message SmokeRunRequest {
  string request_id = 1;
  string manifest_yaml = 2;
}

message SmokeRunResult {
  bool success = 1;
  int32 exit_code = 2;
  string log_output = 3;
  string error_message = 4;
}

// ─────────────────────────────────────────────────────────────────────────────
// ToolRegistryService — RegisteredToolDefinition 관리
// ─────────────────────────────────────────────────────────────────────────────

service ToolRegistryService {
  rpc RegisterTool(RegisterToolRequest) returns (RegisterToolResponse);
  rpc GetTool(GetToolRequest) returns (RegisteredToolDefinition);
  rpc ListTools(ListToolsRequest) returns (ListToolsResponse);
  rpc RetractTool(RetractToolRequest) returns (RetractToolResponse);
  rpc DeleteTool(DeleteToolRequest) returns (DeleteToolResponse);

  // RegisterToolFunction receives a typed ToolFunctionSpec declaration (issue
  // #19 W1/W2). Unlike the first-image build path (raw_spec string), the second
  // image is authored in NodeKit as typed contracts, so NodeVault receives them
  // typed and computes tool_function_digest over its own canonical JSON (N3).
  rpc RegisterToolFunction(RegisterToolFunctionRequest) returns (RegisterToolFunctionResponse);
}

message RegisterToolRequest {
  string request_id = 1;
  string tool_definition_id = 2;
  string tool_name = 3;
  string image_uri = 4;
  string digest = 5;
  string environment_spec = 8;
  string version = 9;
  string stable_ref = 10;
  BuildKind build_kind = 15;

  // Build-time registration stores ToolSpec image/environment metadata only.
  // ToolFunctionSpec metadata is not accepted on this request; command,
  // inputs, outputs, and display are populated by the function/validation path.
  reserved 6, 7, 11, 12, 13, 14;
  reserved "input_names", "output_names", "inputs", "outputs", "display", "command";
}

message RegisterToolResponse {
  string cas_hash = 1;
  RegisteredToolDefinition tool = 2;
}

message GetToolRequest {
  string cas_hash = 1;
}

message ListToolsRequest {
  string stable_ref = 1;
  string artifact_kind = 2;
}

message ListToolsResponse {
  repeated RegisteredToolDefinition tools = 1;
}

message RegisteredToolDefinition {
  string cas_hash = 1;
  string tool_definition_id = 2;
  string tool_name = 3;
  string image_uri = 4;
  string digest = 5;
  int64 registered_at = 8;
  string environment_spec = 9;
  string version = 10;
  string stable_ref = 11;
  string lifecycle_phase = 15;
  ValidationStatus validation = 16;
  string integrity_health = 18;
  BuildKind build_kind = 19;

  // Deprecated declaration surface (W1-LEGACY-PORT FINAL, issue #19). These four
  // fields and the legacy PortSpec/DisplaySpec messages are kept as a deprecated
  // compatibility surface — NOT reclaimed, NOT converted to reserved. The new
  // RegisterToolFunction write path does NOT populate them; declaration authority
  // is owned solely by the ToolFunction contract (ToolFunctionSpec / FunctionPortSpec).
  // No automatic conversion, dual-write, or backfill between legacy PortSpec.shape
  // and FunctionPortSpec.cardinality. Any past non-empty legacy value may be
  // preserved/read, but is NOT reinterpreted with new FunctionPortSpec semantics.
  repeated PortSpec inputs = 12 [deprecated = true];
  repeated PortSpec outputs = 13 [deprecated = true];
  DisplaySpec display = 14 [deprecated = true];
  string command = 17 [deprecated = true];

  reserved 6, 7;
  reserved "input_names", "output_names";
}

message RetractToolRequest {
  string cas_hash = 1;
  string reason = 2;
}

message RetractToolResponse {
  string cas_hash = 1;
  string lifecycle_phase = 2;
}

message DeleteToolRequest {
  string cas_hash = 1;
  string reason = 2;
}

message DeleteToolResponse {
  string cas_hash = 1;
  string lifecycle_phase = 2;
}

// ─────────────────────────────────────────────────────────────────────────────
// ToolFunctionSpec 등록 (issue #19 W1 — proto 정의만; 구현은 W2)
//
// 설계 정본: Platform Spec Wiki "NodeVault issue #19 설계안 — ToolFunctionSpec
// 등록 경로" §4 (W1-CQ4 / W1-LEGACY-PORT / W1-Q1 CASHASH / W1 DIGEST-INPUT
// SUBTYPE FREEZE — all FINAL 2026-08-17). 헌법 §1.2 / §1.10.
//
// digest 입력 (§4.2, D-19-3): tool_function_digest = SHA256(canonical_json(
//   { base_tool_spec_digest, spec })). spec(ToolFunctionSpec) 전체가 입력이며,
//   그 외 presentation / validation_policy / environment_hints 는 입력이 아니다.
//   ToolFunctionSpec 안에는 digest 제외 필드가 없다 — 「저작 단언 전부 = 입력」.
//
// 정규화 (§4.3 / D-19-5): N1 미지정과 빈 값을 구분하고 미지정은 canonical JSON
//   에서 생략한다. N2 정규형은 하나. N3 정규화의 소유자는 NodeVault다 — NodeKit
//   Normalize()는 UX용이며 identity 근거가 아니다. typed 전송이므로 NodeVault가
//   자기 canonical JSON으로 직렬화해 digest를 계산하는 것이 구조로 보장된다.
// ─────────────────────────────────────────────────────────────────────────────

// Cardinality — 포트가 받는/내는 항목 수 계약. ⚠ legacy PortSpec.shape(single/pair
// 파일 묶음 힌트)와 무관한 별도 축이다(Q3 확정 2026-08-04). 대응표·자동 migration을
// 만들지 않는다. N1: CARDINALITY_UNSPECIFIED 는 canonical JSON에서 생략한다.
enum Cardinality {
  CARDINALITY_UNSPECIFIED = 0;
  CARDINALITY_SINGLE = 1;
  CARDINALITY_MULTIPLE = 2;
}

enum ParameterType {
  PARAMETER_TYPE_UNSPECIFIED = 0;
  PARAMETER_TYPE_STRING = 1;
  PARAMETER_TYPE_INTEGER = 2;
  PARAMETER_TYPE_NUMBER = 3;
  PARAMETER_TYPE_BOOLEAN = 4;
  PARAMETER_TYPE_ENUM = 5;
}

enum IntermediateFilePolicyKind {
  INTERMEDIATE_FILE_POLICY_KIND_UNSPECIFIED = 0;
  INTERMEDIATE_FILE_POLICY_KIND_EPHEMERAL = 1;
  INTERMEDIATE_FILE_POLICY_KIND_CACHE = 2;
  INTERMEDIATE_FILE_POLICY_KIND_CHECKPOINT = 3;
  INTERMEDIATE_FILE_POLICY_KIND_SIDECAR_OUTPUT = 4;
  INTERMEDIATE_FILE_POLICY_KIND_SENSITIVE_TEMP = 5;
}

// digest-out subtype (validation policy). W1은 digest-out subtype의 내부
// semantics를 과잉 동결하지 않는다.
enum ObservationLevel {
  OBSERVATION_LEVEL_UNSPECIFIED = 0;
  OBSERVATION_LEVEL_BASIC = 1;
  OBSERVATION_LEVEL_ENHANCED = 2;
  OBSERVATION_LEVEL_FULL = 3;
}

// ── 저작 단언 — digest 입력 (ToolFunctionSpec 전체가 preimage) ────────────────

message ToolFunctionSpec {
  CommandContract command = 1;
  repeated FunctionPortSpec inputs = 2;
  repeated FunctionPortSpec outputs = 3;
  repeated ParameterSpec parameters = 4;
  repeated IntermediateFilePolicy intermediate_file_policies = 5;
  // execution_environment: supported_platforms 는 여기 없다 — 그것은 digest-out
  // 인 ToolFunctionEnvironmentHints 소속이다(Q2 CLOSED 2026-08-17).
  ExecutionEnvironmentSpec execution_environment = 6;
}

message CommandContract {
  string executable = 1;
  repeated string arguments = 2;
  string working_directory = 3;
  repeated EnvironmentEntry environment = 4;
  repeated int32 success_exit_codes = 5;
  TimeoutPolicy timeout_policy = 6;
}

// EnvironmentEntry = {name, source} (W1 DIGEST-INPUT SUBTYPE FREEZE). literal
// value나 source-kind oneof를 발명하지 않는다.
message EnvironmentEntry {
  string name = 1;
  string source = 2;
}

// TimeoutPolicy = {soft_seconds?, hard_seconds?} (FREEZE). N1: 미지정(0)은
// canonical JSON에서 생략한다.
message TimeoutPolicy {
  int32 soft_seconds = 1;
  int32 hard_seconds = 2;
}

// FunctionPortSpec — 8필드. downstream_compatibility_note 는 여기 없다: 그것은
// output-port-scoped human presentation 이라 ToolFunctionPresentation 소속이며
// digest-out 이다(W1-CQ4 FINAL). cardinality 는 위 enum 주석대로 shape와 다른 축.
message FunctionPortSpec {
  string name = 1;
  string data_format = 2;
  Cardinality cardinality = 3;
  bool required = 4;
  string path_or_glob = 5;
  string path_placement_rule = 6;
  repeated string companion_files = 7;
  string completion_check = 8;
}

// ParameterSpec — 7필드 전부 digest 입력 (W1 DIGEST-INPUT SUBTYPE FREEZE,
// cli_argument_mapping·mutually_exclusive_group 포함).
message ParameterSpec {
  string name = 1;
  ParameterType type = 2;
  string default_value = 3;
  string allowed_range = 4;
  bool required = 5;
  string cli_argument_mapping = 6;
  string mutually_exclusive_group = 7;
}

message IntermediateFilePolicy {
  string path_or_pattern = 1;
  IntermediateFilePolicyKind policy = 2;
}

// ExecutionEnvironmentSpec — digest 입력은 아래 넷뿐이다(W1 DIGEST-INPUT SUBTYPE
// FREEZE). supported_platforms 는 여기 없고 ToolFunctionEnvironmentHints(digest-out).
message ExecutionEnvironmentSpec {
  repeated string writable_paths = 1;
  string network_policy = 2;
  bool requires_root = 3;
  repeated string required_capabilities = 4;
}

// ── digest 밖 (§4.2) ─────────────────────────────────────────────────────────

// OutputPortPresentation — output-port-scoped human presentation. W1-CQ4 FINAL
// referential integrity:
//   - ToolFunctionDigest preimage에 포함하지 않는다(digest-out).
//   - port_name 은 현재 ToolFunctionSpec.outputs 에서 정확히 하나와 일치해야 한다.
//   - 동일 port_name 의 presentation entry 중복 금지.
//   - note가 없으면 entry 자체를 생략할 수 있다.
//   - machine-enforced downstream compatibility가 필요해지면 별도 typed contract를 만든다.
message OutputPortPresentation {
  string port_name = 1;
  string downstream_compatibility_note = 2;
}

// ToolFunctionPresentation — 표시. 별도 revision(D-19-4)으로 identity와 분리된다.
// digest-out. UI(DagEdit Tool Workshop / NodeKit GUI)가 커져도 identity 불변.
message ToolFunctionPresentation {
  string label = 1;
  string short_summary = 2;
  string description = 3;
  string category = 4;
  repeated string tags = 5;
  string locale = 6;
  repeated OutputPortPresentation output_port_presentations = 7;
}

// ToolFunctionValidationPolicy — 검증 정책. digest-out.
message ToolFunctionValidationPolicy {
  repeated FixtureReference fixture_references = 1;
  repeated ExpectedResult expected_results = 2;
  ValidationRequirements validation_requirements = 3;
}

message FixtureReference {
  string local_path = 1;
  string content_digest = 2;
}

message ExpectedResult {
  string output_port_name = 1;
  string expected_value_or_rule = 2;
}

message ValidationRequirements {
  ObservationLevel minimum_observation_level = 1;
  map<string, bool> required_coverage = 2;
}

// ToolFunctionEnvironmentHints — 환경 호환 선언. digest-out. supported_platforms
// 는 EnvironmentCompatibilityClass 축(§16.1.5), enforced_resources 는 ToolProfile
// 축(§6.1.3·§21.27.1) — 둘 다 identity(digest)가 아니다.
message ToolFunctionEnvironmentHints {
  repeated string supported_platforms = 1;
  ResourceContract enforced_resources = 2;
}

// ResourceContract — digest-out(ToolProfile 축). W1은 내부 semantics를 과잉
// 동결하지 않는다.
message ResourceContract {
  string cpu_request = 1;
  string cpu_limit = 2;
  string memory_request = 3;
  string memory_limit = 4;
  string storage_request = 5;
  string storage_limit = 6;
  int32 max_execution_time_seconds = 7;
  int32 parallelism = 8;
}

// ── 등록 RPC ─────────────────────────────────────────────────────────────────

message RegisterToolFunctionRequest {
  string request_id = 1;               // 멱등 키 (SubmitToolBuild 와 같은 패턴)
  // base_tool_spec_digest — 1차 base ToolSpec 이미지의 digest. digest 입력에
  // 포함되며, 이 필드가 lineage(계보) 의미를 소유한다. 최종 casHash 자체는
  // lineage pointer가 아니다 — dependency 의미는 이 typed digest 참조가 소유하며
  // stable_ref/cas_hash 로 계보를 추론하지 않는다(W1-Q1 CASHASH RELATION FINAL).
  string base_tool_spec_digest = 2;
  string image_digest = 3;             // 2차(function) 이미지 digest
  ToolFunctionSpec spec = 4;
  ToolFunctionPresentation presentation = 5;
  ToolFunctionValidationPolicy validation_policy = 6;
  ToolFunctionEnvironmentHints environment_hints = 7;
}

message RegisterToolFunctionResponse {
  // tool_function_digest — NodeVault가 canonical JSON 위에서 계산한다(W2):
  //   tool_function_digest = SHA256(canonical_json({ base_tool_spec_digest, spec })).
  // §4.3: 최종 runnable-artifact casHash 는 ToolFunctionArtifactSpec
  //   = { tool_function_digest, function_image_digest, ...immutable typed refs }
  // 의 SHA256이다. tool_function_digest 또는 function_image_digest 변경은 casHash
  // 변경, presentation/validation/lifecycle/integrity/timestamp 변경은 비변경이다.
  string tool_function_digest = 1;
  string presentation_revision_id = 2;   // presentation 은 별도 revision (D-19-4)
}

// ─────────────────────────────────────────────────────────────────────────────
// DataRegistryService — 참조 데이터(reference data) artifact 관리
// ─────────────────────────────────────────────────────────────────────────────

service DataRegistryService {
  rpc RegisterData(DataRegisterRequest) returns (DataRegisterResponse);
  rpc GetData(GetDataRequest) returns (RegisteredDataDefinition);
  rpc ListData(ListDataRequest) returns (ListDataResponse);
}

message DataRegisterRequest {
  string request_id = 1;
  string data_name = 2;
  string version = 3;
  string description = 4;
  string format = 5;
  string source_uri = 6;
  string checksum = 7;
  string storage_uri = 8;
  string stable_ref = 9;
  DisplaySpec display = 10;
}

message DataRegisterResponse {
  string cas_hash = 1;
  RegisteredDataDefinition data = 2;
}

message GetDataRequest {
  string cas_hash = 1;
}

message ListDataRequest {
  string stable_ref = 1;
}

message ListDataResponse {
  repeated RegisteredDataDefinition data = 1;
}

message RegisteredDataDefinition {
  string cas_hash = 1;
  string data_name = 2;
  string version = 3;
  string description = 4;
  string format = 5;
  string source_uri = 6;
  string checksum = 7;
  string storage_uri = 8;
  string stable_ref = 9;
  DisplaySpec display = 10;
  int64 registered_at = 11;
  string lifecycle_phase = 12;
  string integrity_health = 13;
}

// ─────────────────────────────────────────────────────────────────────────────
// ValidationResultService — NodeSentinel → NodeVault validation record push
// ─────────────────────────────────────────────────────────────────────────────

service ValidationResultService {
  // SubmitToolCheckRecord receives a L5-a functional validation result from NodeSentinel.
  rpc SubmitToolCheckRecord(ToolCheckRecordRequest) returns (SubmitRecordResponse);
  // SubmitToolScanRecord receives a L5-b trivy security scan result from NodeSentinel.
  rpc SubmitToolScanRecord(ToolScanRecordRequest) returns (SubmitRecordResponse);
  // ListCertifiedTools returns all active certified tool catalog entries.
  rpc ListCertifiedTools(ListCertifiedToolsRequest) returns (ListCertifiedToolsResponse);
}

message PortObservation {
  string port = 1;
  int32 file_count = 2;
  bool non_empty = 3;
}

message ObservedIoProfile {
  repeated PortObservation inputs = 1;
  repeated PortObservation outputs = 2;
}

message ObservedResourceProfile {
  int64 peak_cpu_millicores = 1;
  int64 peak_memory_mib = 2;
  int64 duration_seconds = 3;
  int64 disk_read_mib = 4;
  int64 disk_write_mib = 5;
  bool timeout = 6;
  int64 timeout_seconds = 7;
}

message ContractCheck {
  bool all_outputs_present = 1;
  string result = 2; // "pass" | "fail" | "unknown"
}

message ToolCheckRecordRequest {
  string check_id = 1;
  string tool_spec_digest = 2;
  string image_digest = 3;
  string tool_name = 4;
  string version = 5;
  // validation_status: "succeeded" | "infra_failed" | "app_failed"
  string validation_status = 6;
  string validation_hash = 7;
  string command = 8;
  int32 exit_code = 9;
  ObservedIoProfile observed_io_profile = 10;
  ObservedResourceProfile observed_resource_profile = 11;
  ContractCheck contract_check = 12;
  string failure_reason = 13;
  int64 checked_at = 14;
  string platform = 15;
}

message ToolScanRecordRequest {
  string scan_id = 1;
  string image_digest = 2;
  string tool_name = 3;
  string scanner = 4;
  string scanner_version = 5;
  string source = 6;
  int32 critical_count = 7;
  int32 high_count = 8;
  int32 medium_count = 9;
  int32 low_count = 10;
  string policy_mode = 11;
  string policy_result = 12;
  int64 scanned_at = 13;
  string db_digest = 14;
  string platform = 15;
}

message SubmitRecordResponse {
  string record_id = 1;
  string certification_status = 2; // "certified" | "pending" | "failed"
}

message ListCertifiedToolsRequest {
  string promotion_status = 1; // "" = all active
}

message CertifiedToolEntry {
  string cas_hash = 1;
  string tool_name = 2;
  string version = 3;
  string stable_ref = 4;
  string image_digest = 5;
  string image_ref = 6;
  string display_label = 7;
  string display_category = 8;
  string promotion_status = 9;
  int64 certified_at = 10;
  string validation_hash = 11;
}

message ListCertifiedToolsResponse {
  repeated CertifiedToolEntry tools = 1;
}

// ─────────────────────────────────────────────────────────────────────────────
// PingService — Phase 0 연결 확인용 (ping/pong)
// ─────────────────────────────────────────────────────────────────────────────

service PingService {
  rpc Ping(PingRequest) returns (PingResponse);
}

message PingRequest {
  string message = 1;
}

message PingResponse {
  string message = 1;
  string server_id = 2;
}
